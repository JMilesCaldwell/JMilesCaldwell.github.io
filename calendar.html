<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berynian Calendar</title>
  <link rel="icon" href="/resources/compass_favicon_32x32.png" type="image/png">

  <link 
    href="https://fonts.googleapis.com/css2?family=Almendra&family=Cinzel:wght@400;700&display=swap" 
    rel="stylesheet"
  >
  <style>
    body {
      margin: 0;
      background: url('resources/calendar.png') no-repeat center center fixed;
      background-size: cover; /* Ensures the image covers the entire screen */
      color: #FAF4E0;
      font-family: 'Almendra', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
      text-align: center;
    }
    .container {
      max-width: 800px;
      margin: 2rem auto;
      background: rgba(0, 0, 0, 0.7);
      padding: 2rem;
      border-radius: 10px;
    }
    h1, h2 {
      font-family: 'Cinzel', 'Trajan Pro', 'Palatino Linotype', Palatino, Georgia, serif;
    }
    .calendar, .weather {
      margin-top: 2rem;
      padding: 2rem;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #ddd;
      text-align: left;
    }
    .divider {
      margin: 1rem auto;
      font-size: 1.5rem;
    }
    .divider::after {
      content: "✦ ✧ ✦";
      color: #8B0000;
      letter-spacing: 0.5rem;
    }
    .button {
      background-color: #8B0000;
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 1rem;
      margin: 0.5rem 0;
      font-family: 'Cinzel', 'Trajan Pro', 'Palatino Linotype', Palatino, Georgia, serif;
      text-decoration: none;
      display: inline-block;
    }
    .button:hover {
      background-color: #6B0000;
    }
    footer {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #CFC6B0;
      text-shadow: 0 1px 3px #000;
      font-family: 'Almendra', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Berynian Calendar & Weather</h1>
  <div class="calendar">
    <h2>Current Date</h2>
    <p id="evershroud-date"></p>
    <p id="evershroud-time"></p>
  </div>

  <div class="weather">
    <h2>Current Weather</h2>
    <p id="weather-pattern"></p>
    <p id="weather-description"></p>
    <p><strong>Sea lanes open:</strong> <span id="sea-lanes-status"></span></p>
  </div>

  <div class="divider"></div>

  <!-- Buttons -->
  <a href="caldwell-repo.html" class="button">Home</a>
  <a href="resources/A%20Treatise%20on%20Shaniqu%C3%A1an%20Chronology%20and%20Meteorology,%201st%20Edition.pdf" 
     class="button" target="_blank">
    Shaniquáan Chronology and Meteorology
  </a>
</div>

<footer>
  &copy; 2025 Caldwell. Providing accurate chronological and meteorological information for the Evershroud Isles.
</footer>

<script src="resources/berynian.js"></script>
<script>
  // Date, weather and sea lanes come from resources/berynian.js, shared with the hub.
  function updateEvershroudCalendar() {
    const date = Berynian.getDate();
    const weather = Berynian.getWeather(date);
    document.getElementById("evershroud-date").innerText = date.label;
    document.getElementById("evershroud-time").innerText = `Time: ${new Date().toLocaleTimeString()}`;
    document.getElementById("weather-pattern").innerText = weather.name;
    document.getElementById("weather-description").innerText = weather.description;
    document.getElementById("sea-lanes-status").innerText = Berynian.seaLanesOpen(date) ? "Yes" : "No";
  }

  setInterval(updateEvershroudCalendar, 1000);
  updateEvershroudCalendar();
</script>

</body>
</html>
