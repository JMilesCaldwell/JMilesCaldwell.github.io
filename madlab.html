<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mad Lab</title>
  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" href="/resources/compass_favicon_32x32.png" type="image/png">
  <link rel="stylesheet" href="resources/evershroud.css">
  <style>
    body.es { background-image: url('resources/madlab.png'); }
    .container { max-width: 800px; text-align: center; }
    .subtitle { font-size: 1.15rem; font-style: italic; margin-bottom: 1.25rem; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    .tile {
      position: relative; display: block; overflow: hidden; border-radius: 12px;
      border: 1px solid var(--es-rule-strong); box-shadow: var(--es-shadow); transition: transform 0.2s ease;
    }
    .tile:hover { transform: translateY(-2px); }
    .tile img { width: 100%; height: auto; display: block; }
    /* The label used to appear on mouse-over only; now it is always there */
    .tile .overlay {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 0.6rem;
      font-family: var(--es-f-head); font-size: 1.3rem; letter-spacing: 0.06em; color: var(--es-head);
      background: linear-gradient(transparent, rgba(8, 18, 20, 0.85));
    }
  </style>
</head>
<body class="es">
  <nav class="es-trail" aria-label="Where you are">
    <ol>
      <li><a href="caldwell-repo.html">Repository</a></li>
      <li><span>Other</span></li>
      <li><span aria-current="page">Mad Lab</span></li>
    </ol>
  </nav>

  <div class="container">
    <h1>Mad Lab</h1>
    <p class="subtitle">Experiments in worldbuilding - enter at your own risk.</p>
    
    <div class="grid">
      <a class="tile" href="madlab1.html">
        <img src="resources/labgate.png" alt="Mad Lab 1">
        <div class="overlay">Lab 1</div>
      </a>
      <a class="tile" href="madlab2.html">
        <img src="resources/labgate.png" alt="Mad Lab 2">
        <div class="overlay">Lab 2</div>
      </a>
      <a class="tile" href="madlab3.html">
        <img src="resources/labgate.png" alt="Mad Lab 3">
        <div class="overlay">Lab 3</div>
      </a>
      <a class="tile" href="madlab4.html">
        <img src="resources/labgate.png" alt="Mad Lab 4">
        <div class="overlay">Lab 4</div>
      </a>
    </div>
    
  </div>
</body>
</html>
